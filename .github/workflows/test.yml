name: Test

# The plugin's and the server's tests: on every pull request (Dependabot's too, so an update is tested before anyone
# merges it), and as the first job of a release (release.yml calls this)
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: plugin

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          working-directory: backend
          bundler-cache: true

      - run: make deps test
