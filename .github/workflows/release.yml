name: Release

on:
  # make patch / minor / major on a machine
  push:
    tags: ['*']
  # The same from here: Actions tab → Release → Run workflow
  workflow_dispatch:
    inputs:
      level:
        description: Version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

defaults:
  run:
    working-directory: plugin

jobs:
  # The same tests as on a pull request
  test:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  # What this token pushes starts no workflow, so the tag doesn't either: the release below is this run's
  bump:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.bump.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - id: bump
        run: make ci-bump
        env:
          LEVEL: ${{ inputs.level }}

  # A job of its own: installed gems must not land in the image's build context
  image:
    needs: [test, bump]
    # bump is skipped on a tag push, which would skip this too
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.bump.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.bump.outputs.ref || github.ref }}

      - run: make release-image
        env:
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ github.token }}

  # After the image: no plugin out before its server, and a failed image is re-run alone
  plugin:
    needs: [bump, image]
    if: ${{ !cancelled() && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # attestations: signed with this workflow's identity
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.bump.outputs.ref || github.ref }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - run: make deps check-tag build

      # Build provenance for the files the release carries, before it's out: `gh attestation verify main.js
      # --repo <owner>/<repo>` proves a file was built by this workflow from this commit
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            plugin/dist/main.js
            plugin/dist/manifest.json
            plugin/dist/styles.css

      - run: make release-plugin
        env:
          GH_TOKEN: ${{ github.token }}
